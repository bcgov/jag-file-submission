server {

  listen 8080;

  # The old SPA redirected "/" to the app; do it here now that react-router is gone
  location = / {
    return 302 /efilinghub;
  }

  # Next.js static export (output: "export", basePath: "/efilinghub"):
  #   /efilinghub                -> index.html
  #   /efilinghub/submissionhistory -> submissionhistory.html  ($uri.html)
  location /efilinghub {
    root   /etc/nginx/html/;
    try_files $uri $uri.html /efilinghub/index.html;
  }

  # /efilinghub/packagereview/<any id> is served by ONE exported shell page;
  # the package id is read from the URL in the browser, so any id maps to it.
  location ~ ^/efilinghub/packagereview/[^/]+/?$ {
    root   /etc/nginx/html/;
    rewrite ^ "/efilinghub/packagereview/[packageId].html" break;
  }

  location ~* /efilinghub/\.env-config\.js$ {
    expires -1;
    add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store";
    add_header "Pragma" "no-cache";
    add_header Content-Security-Policy "default-src 'self';";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  
  location /images {
    deny all;
  }
  
  location /static {
    deny all;
  }

}
